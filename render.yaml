# Render.com 后端部署配置
# 文档: https://render.com/docs/blueprint-spec
# 使用方法: 在 Render Dashboard 创建新 Web Service，连接 GitHub 仓库，选择此配置

services:
  - type: web
    name: infinshow-backend
    runtime: python
    region: singapore  # 新加坡节点，离中国近
    plan: free  # 免费版 750 小时/月
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true  # Render 自动生成
      - key: ALLOWED_ORIGINS
        value: "*"  # 部署后改为前端域名
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./infinshow.db  # 免费版用 SQLite
      - key: DATABASE_URL_SYNC
        value: sqlite:///./infinshow.db
      - key: INFINISYNAPSE_API_KEY
        sync: false  # 在 Dashboard 手动输入，不写入配置文件
      - key: INFINISYNAPSE_BASE_URL
        value: https://app.infinisynapse.cn
      - key: LOCAL_UPLOAD_DIR
        value: ./data/uploads
    disk:
      name: infinshow-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1  # 免费版最大 1GB 持久磁盘
